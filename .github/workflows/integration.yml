name: integration

on:
  pull_request:
    branches: [main]

jobs:
  integration-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run integration suite
        run: |
          python tests/run_integration_tests.py --n-opportunities 120 --time-acceleration 100

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashix-integration-report
          path: |
            docs/integration_reports/latest.json
            docs/integration_reports/baseline_report.json
            docs/integration_reports/latest_latency.md

      - name: Comment latency table on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'docs/integration_reports/latest_latency.md';
            if (!fs.existsSync(path)) {
              core.warning('Latency report not found; skipping PR comment.');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Flashix Integration Latency\n\n${body}`,
            });
