name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install root deps
        run: npm ci
      - name: Run unit tests
        run: npm test --silent
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run type-check
          npm run build
