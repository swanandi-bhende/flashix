name: inference_validation

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run replay validation tests
        run: |
          python -m pytest tests/replay/ -v --tb=short --json-report --json-report-file=replay_report.json

      - name: Upload replay report artifact
        uses: actions/upload-artifact@v4
        with:
          name: inference-replay-report
          path: |
            replay_report.json
            docs/validation_reports/latest.json
            docs/validation_reports/*.md

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'docs/validation_reports/latest.json';
            if (!fs.existsSync(path)) {
              core.warning('Validation summary not found; skipping PR comment.');
              return;
            }
            const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
            const report = summary.report || summary;
            const message = report.deployment_recommended
              ? `✅ Inference Validation PASSED: determinism=${(report.determinism_pass_rate * 100).toFixed(1)}%, accuracy=${(report.accuracy_pass_rate * 100).toFixed(1)}%, signal_quality=${report.signal_quality_met ? 'met' : 'failed'}`
              : `❌ Inference Validation FAILED: ${report.critical_failures.length} critical failures detected — deployment blocked`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message,
            });
