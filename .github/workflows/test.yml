name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gas-profile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run gas profile
        run: npm run gas-profile
      - name: Verify gas budgets
        run: python ../scripts/check_gas_budget.py gas-report.txt
